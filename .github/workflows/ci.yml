name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Download javax.servlet-api
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          $url = "https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/3.1.0/javax.servlet-api-3.1.0.jar"
          Invoke-WebRequest -Uri $url -OutFile deps/javax.servlet-api-3.1.0.jar
          "ALDHANI_SERVLET_JAR=$pwd\deps\javax.servlet-api-3.1.0.jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and self-test
        shell: pwsh
        run: .\build.ps1
