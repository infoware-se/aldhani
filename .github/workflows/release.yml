name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download javax.servlet-api
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          $url = "https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/3.1.0/javax.servlet-api-3.1.0.jar"
          Invoke-WebRequest -Uri $url -OutFile deps/javax.servlet-api-3.1.0.jar
          "ALDHANI_SERVLET_JAR=$pwd\deps\javax.servlet-api-3.1.0.jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and self-test
        shell: pwsh
        run: .\build.ps1
      - name: Publish GitHub release with jar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag must be vX.Y.Z, got $tag"
          }
          $ver = $Matches[1]
          $jar = "target\infoware-aldhani-$ver.jar"
          if (-not (Test-Path $jar)) {
            throw "Missing $jar. Bump the version in build.ps1, feature.xml, and MANIFEST.MF to $ver before tagging $tag."
          }
          $notes = @"
          Aldhani $ver

          Install: copy ``infoware-aldhani-$ver.jar`` with ``install.ps1`` after ``tell http quit``, then ``load http``.

          See the README for configuration and MCP tools.
          "@
          gh release create $tag $jar --title "Aldhani $ver" --notes $notes --verify-tag
