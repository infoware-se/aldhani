name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download javax.servlet-api
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          $url = "https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/3.1.0/javax.servlet-api-3.1.0.jar"
          Invoke-WebRequest -Uri $url -OutFile deps/javax.servlet-api-3.1.0.jar
          "ALDHANI_SERVLET_JAR=$pwd\deps\javax.servlet-api-3.1.0.jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - uses: github/codeql-action/analyze@v3
