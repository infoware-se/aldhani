name: Feature request
description: A new MCP tool or behavior for Aldhani
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem
      description: What an agent or operator cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tool name, arguments, and whether Kyber needs a new route first.
    validations:
      required: true
